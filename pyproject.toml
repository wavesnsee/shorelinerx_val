[project]
name = "shorelinerx_val"
version = "0.1.0"
description = "Validation to assess shorelinerx waterlines accuracy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.9.2",
    "esmbenchmarkviz>=0.2.2",
    "fastparquet>=2026.5.0",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.5",
    "pyqt5>=5.15.11",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "typer>=0.27.2",
    "verde>=1.9.0",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
shorelinerx_val = "shorelinerx_val.cli.app:app"
